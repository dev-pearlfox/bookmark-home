name: CI

# Quality gate for every pull request. Make this check REQUIRED in the
# repo's branch-protection rules so nothing merges (and therefore nothing
# deploys) unless lint, tests, build and the security audit are green.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to full commit SHAs (the version in the
      # comment is what Dependabot keeps up to date).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fails the PR on a known HIGH/CRITICAL advisory in any dependency.
      - run: npm audit --audit-level=high
